version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: GeneradorInformes-app
    volumes:
      - .:/var/www
    depends_on:
      - mysql

  nginx:
    image: nginx:stable
    container_name: GeneradorInformes-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: GeneradorInformes-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reportes_db
      MYSQL_USER: report_user
      MYSQL_PASSWORD: report_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d

volumes:
  mysql_data: